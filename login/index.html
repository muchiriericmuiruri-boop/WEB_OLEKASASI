<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Olekasasi Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #800000, #001f3f);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .login-box {
            background: rgba(0,0,0,0.5);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            width: 320px;
        }
        h2 {
            margin-bottom: 30px;
        }
        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 5px;
            border: none;
        }
        button {
            padding: 12px 20px;
            background: white;
            color: #001f3f;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background: #ccc;
        }
        .message {
            margin-top: 15px;
            color: #ffdddd;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login to Olekasasi Portal</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="message" id="message"></div>
    </div>

    <!-- Firebase JS -->
    <script src="firebase.js"></script>
    <script src="main.js"></script>

    <script>
        // Optional: Basic front-end handling for form
        const loginForm = document.getElementById('loginForm');
        const message = document.getElementById('message');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Here you can call your Firebase login function from main.js
            // Example:
            // firebaseLogin(email, password).catch(err => message.textContent = err.message);

            message.textContent = "Login function will be handled by Firebase!";
        });
    </script>
</body>
</html>
