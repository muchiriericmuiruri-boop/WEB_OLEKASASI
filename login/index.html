<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Olekasasi Portal</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #800000, #001f3f);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .login-box {
      background: rgba(0,0,0,0.5);
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      width: 320px;
    }
    h2 { margin-bottom: 30px; }
    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 12px 20px;
      background: white;
      color: #001f3f;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }
    button:hover { background: #ccc; }
    .message { margin-top: 15px; color: #ffdddd; }
    #loginSuccess { color: lightgreen; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login to Olekasasi Portal</h2>
    <form id="loginForm" onsubmit="loginUser(); return false;">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div id="loginMessage" class="message"></div>
    <div id="loginSuccess" class="message"></div>
  </div>

  <!-- Firebase + Login JS (paths relative to login folder) -->
  <script type="module" src="./firebase.js"></script>
  <script type="module" src="./login.js"></script>
</body>
</html>
