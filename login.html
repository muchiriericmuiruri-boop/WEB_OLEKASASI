</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="school-logo.jpg" alt="Olekasasi Logo" class="school-logo">
        <div>
          <h1>Olekasasi Mixed Day Secondary School</h1>
          <p class="motto">Strive To Excel</p>
        </div>
      </div>
      <button class="nav-toggle" onclick="toggleNav()">☰</button>
      <nav class="main-nav" id="mainNav">

  <main>
    <section>
      <h2>Login</h2>
      <p>Enter your credentials to access student or staff portal.</p>

      <form id="loginForm">
        <label for="username">Username or Email:</label>
        <input type="text" id="username" name="username" placeholder="Enter username or email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
      </form>

      <p id="loginMessage" style="color: red; margin-top: 10px;"></p>
    </section>
  </main>

  </footer>
