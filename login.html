<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Login | Olekasasi Mixed Day Secondary</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #003366, #006699);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #003366;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #999;
            font-size: 16px;
        }

        input:focus {
            border-color: #006699;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #003366;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #005599;
        }

        .error {
            color: red;
            margin-top: 10px;
            display: none;
        }

        .success {
            color: green;
            margin-top: 10px;
            display: none;
        }
    </style>

</head>
<body>

    <div class="login-box">
        <h2>School Login</h2>

        <input type="text" id="username" placeholder="Enter Username" required>
        <input type="password" id="password" placeholder="Enter Password" required>

        <button onclick="loginUser()">Login</button>

        <p id="loginMessage" class="error"></p>
        <p id="loginSuccess" class="success"></p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"></script>

    <!-- Your Firebase Config -->
    <script src="firebase.js"></script>

    <!-- Login Logic -->
    <script src="main.js"></script>

</body>
</html>
