<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Login | Olekasasi Mixed Day Secondary</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #800000, #001f3f); /* maroon to navy blue */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-box {
        width: 380px;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        text-align: center;
        position: relative;
    }

    .logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        position: absolute;
        top: -40px;
        left: calc(50% - 40px);
        border: 3px solid #800000; /* maroon border */
        background: white;
    }

    h2 {
        margin-top: 50px;
        color: #001f3f; /* navy blue */
    }

    .motto {
        font-size: 14px;
        color: #800000;
        font-style: italic;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 5px;
        border: 1px solid #999;
        font-size: 16px;
    }

    input:focus {
        border-color: #001f3f;
        outline: none;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        background: #800000;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 17px;
        cursor: pointer;
    }

    button:hover {
        background: #b22222;
    }

    .error {
        color: red;
        margin-top: 10px;
        display: none;
    }

    .success {
        color: green;
        margin-top: 10px;
        display: none;
    }
</style>
</head>
<body>

<div class="login-box">
    <img src="school-logo.png" alt="Olekasasi Logo" class="logo">
    <h2>Olekasasi Mixed Day Secondary</h2>
    <p class="motto">Strive to Excel</p>

    <input type="text" id="username" placeholder="Enter Username" required>
    <input type="password" id="password" placeholder="Enter Password" required>

    <button onclick="loginUser()">Login</button>

    <p id="loginMessage" class="error"></p>
    <p id="loginSuccess" class="success"></p>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"></script>

<!-- Firebase config -->
<script src="firebase.js"></script>
<!-- Login logic -->
<script src="main.js"></script>

</body>
</html>
