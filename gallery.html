<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Olekasasi School</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #001f3f;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .school-logo {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
    }

    .brand .motto {
      margin: 0;
      font-size: 14px;
      font-style: italic;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 15px;
      padding: 0;
      margin: 0;
      flex-wrap: wrap;
      align-items: center;
    }

    nav ul li {
      margin: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 5px;
    }

    nav a.active, nav a:hover {
      background: #800000;
    }

    main {
      padding: 40px 20px;
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }

    .gallery img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    /* Hover effects for style variation */
    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    /* Different sizes for random style */
    .gallery img:nth-child(5n) { height: 180px; }
    .gallery img:nth-child(7n) { height: 200px; }
    .gallery img:nth-child(3n) { height: 160px; }

    footer {
      background: #001f3f;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="school-logo.jpg" alt="Olekasasi Logo" class="school-logo">
      <div>

    <nav>

        <li><a href="admissions.html" class="admissions-link">Admissions</a></li>
       <a href="login/index.html">Login</a>

</html>
