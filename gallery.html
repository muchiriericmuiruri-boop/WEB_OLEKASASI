<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Olekasasi School</title>

  <style>
    :root {
      --maroon: #800000;
      --navy: #001f3f;
      --white: #ffffff;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
    }

    /* HEADER */
    header {
      background: var(--navy);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .school-logo {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 15px;
      padding: 0;
      margin: 0;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 5px;
    }

    nav a.active, nav a:hover {
      background: var(--maroon);
    }

    /* MAIN */
    main {
      padding: 30px 20px;
      text-align: center;
    }

    h2 {
      font-size: 28px;
      color: var(--navy);
    }

    /* GALLERY GRID */
    .gallery {
      margin-top: 30px;
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    }

    .gallery img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Different sizes/styles for variation */
    .gallery img:nth-child(2n) { height: 300px; }
    .gallery img:nth-child(3n) { height: 260px; }
    .gallery img:nth-child(5n) { height: 320px; }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 18px rgba(0,0,0,0.3);
    }

    /* FOOTER */
    footer {
      background: var(--maroon);
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .gallery img {
        height: 180px;
      }
      .gallery img:nth-child(2n) { height: 200px; }
      .gallery img:nth-child(3n) { height: 220px; }
      .gallery img:nth-child(5n) { height: 200px; }
    }

  </style>
</head>

<body>

  <header>
    <div class="brand">
      <img src="main-images/logo.png" alt="Olekasasi Logo" class="school-logo">
      <div>
        <h1>Olekasasi Mixed Day Secondary School</h1>
        <p class="motto">Strive To Excel</p>
      </div>
    </div>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="academics.html">Academics</a></li>
        <li><a href="clubs.html">Clubs</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="staff.html">Staff</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="admissions.html">Admissions</a></li>
        <li><a href="login/index.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>School Gallery</h2>

    <div class="gallery">
      <!-- 10 images from main-images folder -->
      <img src="main-images/parade ground" alt="School Event 1">
      <img src="main-images/school kitchen" alt="School Event 2">
      <img src="main-images/parade" alt="School Event 3">
      <img src="main-images/schoolbus" alt="School Event 4">
      <img src="main-images/prefetcs" alt="School Event 5">
      <img src="main-images/ict club" alt="School Event 6">
      <img src="main-images/school dining hall" alt="School Event 7">
      <img src="main-images/school lab" alt="School Event 8">
      <img src="main-images/studemts" alt="School Event 9">
      <img src="main-images/school administration block" alt="School Event 10">
    </div>

  </main>

  <footer>
    <p>© 2026 Olekasasi — Strive To Excel</p>
  </footer>

</body>
</html>
