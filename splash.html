<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — Olekasasi School</title>
  <style>
    /* SPLASH SCREEN STYLES */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #001f3f 50%, #800000 50%); /* Navy + Maroon split */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      z-index: 9999;
      animation: fadeOut 1s ease forwards;
      animation-delay: 3s; /* Show for 3 seconds */
    }

    #splash img {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ffffff;
      margin-bottom: 20px;
    }

    #splash h1 {
      font-size: 2.2rem;
      margin: 0 20px;
    }

    #splash p {
      font-size: 1.2rem;
      margin-top: 10px;
      color: #ffdddd;
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    #mainContent {
      display: none; /* Hide main content initially */
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      #splash img {
        width: 150px;
        height: 150px;
      }
      #splash h1 {
        font-size: 1.8rem;
      }
      #splash p {
        font-size: 1rem;
      }
    }

    @media (max-width: 600px) {
      #splash img {
        width: 120px;
        height: 120px;
      }
      #splash h1 {
        font-size: 1.5rem;
      }
      #splash p {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash">
    <img src="main-images/school-logo.jpg" alt="Olekasasi Logo">
    <h1>Welcome to Olekasasi Mixed Day Secondary School</h1>
    <p>Ongata Rongai, Kenya</p>
  </div>

  <!-- MAIN WEBSITE CONTENT -->
  <div id="mainContent">
    <!-- Paste your full index.html content here -->
  </div>

  <script>
    // Display main content after splash
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('mainContent').style.display = 'block';
        document.getElementById('splash').style.display = 'none';
      }, 3000); // Match animation-delay
    });
  </script>

</body>
</html>
