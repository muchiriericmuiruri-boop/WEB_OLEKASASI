<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — Olekasasi School</title>
  <style>
    /* THEME COLORS */
    :root {
      --maroon: #800000;
      --navy: #001f3f;
      --white: #ffffff;
    }

    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    /* SPLASH SCREEN */
    #splash {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, var(--navy), var(--maroon));
      color: var(--white);
      width: 100%;
      height: 100%;
      text-align: center;
      padding: 20px;
    }

    #splash img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid var(--white);
    }

    #splash h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    #splash p {
      font-size: 18px;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      #splash img {
        width: 120px;
        height: 120px;
      }
      #splash h1 {
        font-size: 22px;
      }
      #splash p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div id="splash">
    <img src="photos/school-logo.jpg" alt="Olekasasi Logo">
    <h1>Welcome to Olekasasi Mixed Day Secondary School</h1>
    <p>Located in Ongata Rongai, Kenya</p>
  </div>

  <script>
    // Redirect to index.html after 3 seconds
    setTimeout(() => {
      window.location.href = "index.html";
    }, 3000);
  </script>

</body>
</html>
