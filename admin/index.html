<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Olekasasi Portal</title>

<style>
body {
    margin:0;
    font-family: Arial,sans-serif;
    background: linear-gradient(135deg,#001f3f,#800000);
    color:white;
}
header {
    background: rgba(0,0,0,0.6);
    padding: 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
header h1 { margin:0; font-size:22px; }

button {
    padding:10px 16px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:white;
    color:#001f3f;
}
button:hover { background:#ccc; }

nav {
    background: rgba(0,0,0,0.4);
    padding:20px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}
nav a {
    padding:12px 20px;
    text-decoration:none;
    color:#001f3f;
    background:white;
    border-radius:5px;
    font-weight:bold;
}
nav a:hover { background:#ccc; }

main { padding:40px; text-align:center; }

#searchResult {
    margin-top:30px; 
    padding:20px; 
    display:none; 
    background:white; 
    color:black; 
    width:70%; 
    margin:auto; 
    border-radius:10px;
}

.action-btn {
    padding:10px 14px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.edit-btn { background:#007bff; color:white; }
.delete-btn { background:#cc0000; color:white; }
.print-btn { background:#008000; color:white; }
.photo-btn { background:#ff9900; color:white; }

.action-btn:hover { opacity:0.8; }
</style>
</head>

<body>

<header>
    <h1>Admin Official Dashboard</h1>
    <button id="logoutBtn">Logout</button>
</header>

<nav>
  <a href="manage-students.html">Manage Students</a>
  <a href="manage-teachers.html">Manage Teachers</a>
  <a href="manage-theme.html">Change Theme / Logo</a>
  <a href="send-fees.html">Send Fees Info</a>
  <a href="events.html">Manage Events</a>
</nav>

<main>

<h2>Search Student (Admin Full Access)</h2>

<input id="searchInput" type="text"
       placeholder="Enter Name or Admission Number"
       style="padding:10px;width:60%;border-radius:5px;border:none;">

<button onclick="searchStudent()" 
        style="padding:10px 16px;margin-left:10px;border:none;border-radius:5px;">
        Search
</button>

<!-- SEARCH RESULT CARD -->
<div id="searchResult"></div>

</main>

<script>
// ================= SEARCH FUNCTION ===================
function searchStudent() {
    const value = document.getElementById("searchInput").value.trim().toLowerCase();
    if (!value) return alert("Enter name or admission number");

    const students = JSON.parse(localStorage.getItem("students") || "[]");

    const found = students.find(s =>
        (s.name && s.name.toLowerCase().includes(value)) ||
        (s.admission && s.admission.toLowerCase() === value)
    );

    const resultBox = document.getElementById("searchResult");

    if (!found) {
        resultBox.style.display = "block";
        resultBox.innerHTML = `<h3>No student found.</h3>`;
        return;
    }

    // ========== SHOW FULL DETAILS ==========
    resultBox.style.display = "block";
    resultBox.innerHTML = `
        <h2>Student Details</h2>

        <p><strong>Name:</strong> ${found.name || 'N/A'}</p>
        <p><strong>Admission Number:</strong> ${found.admission || 'N/A'}</p>
        <p><strong>Gender:</strong> ${found.gender || 'N/A'}</p>
        <p><strong>Class:</strong> ${found.class || 'N/A'}</p>
        <p><strong>D.O.B:</strong> ${found.dob || 'N/A'}</p>
        <p><strong>Parent Name:</strong> ${found.parent || 'N/A'}</p>
        <p><strong>Phone:</strong> ${found.phone || 'N/A'}</p>
        <p><strong>KCPE Marks:</strong> ${found.kcpe || 'N/A'}</p>
        <p><strong>Address:</strong> ${found.address || 'N/A'}</p>
        <p><strong>Religion:</strong> ${found.religion || 'N/A'}</p>

        <h3>Actions</h3>

        <button class="action-btn edit-btn" onclick="editStudent('${found.admission}')">
            ✏️ Edit Student
        </button>

        <button class="action-btn delete-btn" onclick="deleteStudent('${found.admission}')">
            🗑️ Delete Student
        </button>

        <button class="action-btn photo-btn" onclick="showPhoto('${found.photo || ''}')">
            📸 Show Student Photo
        </button>

        <button class="action-btn print-btn" onclick="printStudent('${found.admission}')">
            🖨️ Print Student Details
        </button>
    `;
}

// ========== EDIT STUDENT ==========
function editStudent(adm){
    window.location.href = `edit-student.html?adm=${adm}`;
}

// ========== DELETE STUDENT ==========
function deleteStudent(adm){
    if(!confirm("Are you sure you want to delete this student?")) return;

    let students = JSON.parse(localStorage.getItem("students") || "[]");
    students = students.filter(s => s.admission !== adm);
    localStorage.setItem("students", JSON.stringify(students));

    alert("Student deleted successfully!");
    location.reload();
}

// ========== SHOW PHOTO ==========
function showPhoto(photo){
    if(!photo) return alert("No photo available for this student.");
    const win = window.open("");
    win.document.write(`<img src="${photo}" style="width:100%;border-radius:10px;">`);
}

// ========== PRINT STUDENT ==========
function printStudent(adm){
    const students = JSON.parse(localStorage.getItem("students") || "[]");
    const s = students.find(st => st.admission === adm);
    if(!s) return;

    const win = window.open("", "PrintWindow");
    win.document.write(`
        <h1>Student Details - ${s.name}</h1>
        <p><strong>Admission:</strong> ${s.admission}</p>
        <p><strong>Class:</strong> ${s.class}</p>
        <p><strong>Gender:</strong> ${s.gender}</p>
        <p><strong>DOB:</strong> ${s.dob}</p>
        <p><strong>Parent:</strong> ${s.parent}</p>
        <p><strong>Phone:</strong> ${s.phone}</p>
    `);
    win.print();
}

// LOGOUT
document.getElementById("logoutBtn").addEventListener("click", () => {
    window.location.href = "login/index.html";
});
</script>

</body>
</html>
