<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Olekasasi Portal</title>
  <style>
    body { margin:0; font-family: Arial,sans-serif; background:linear-gradient(135deg,#001f3f,#800000); color:white; }
    header { background: rgba(0,0,0,0.6); padding: 20px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { margin:0; font-size:22px; }
    button { padding:10px 16px; font-size:16px; border:none; border-radius:5px; cursor:pointer; background:white; color:#001f3f; }
    button:hover { background:#ccc; }
    nav { background: rgba(0,0,0,0.4); padding:20px; display:flex; gap:15px; flex-wrap:wrap; justify-content:center; }
    nav a { padding:12px 20px; text-decoration:none; color:#001f3f; background:white; border-radius:5px; font-weight:bold; }
    nav a:hover { background:#ccc; }
    main { padding:40px; text-align:center; }
  </style>
</head>
<body>

<header>
  <h1>Admin Official Dashboard</h1>
  <button onclick="logoutUser()">Logout</button>
</header>

<nav>
  <a href="manage-students.html">Manage Students</a>
  <a href="manage-teachers.html">Manage Teachers</a>
  <a href="manage-theme.html">Change Theme / Logo</a>
  <a href="send-fees.html">Send Fees Info</a>
  <a href="events.html">Manage Events</a>
</nav>

<main>
  <h2>Welcome, Admin Official!</h2>
  <p>Use the navigation above to manage students, teachers, school theme, fees, and events.</p>
</main>

<script type="module" src="../login/firebase.js"></script>
<script type="module" src="../login/main.js"></script>
<script type="module">
import { auth } from "../login/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "../login/";
    }
});
</script>

</body>
</html>
