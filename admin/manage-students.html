<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Students - Admin</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f0f0;
        margin: 0;
        padding: 20px;
        color: #333;
    }
    h2, h3 { color: #001f3f; }
    form input, form button {
        display: block;
        margin: 10px 0;
        padding: 10px;
        width: 300px;
    }
    form button {
        background: #001f3f;
        color: white;
        border: none;
        cursor: pointer;
    }
    form button:hover { background: #800000; }
    #studentsList img { border-radius: 5px; margin-right: 10px; }
    #studentsList li { margin: 10px 0; list-style: none; }
    #studentsList button {
        margin-left: 10px;
        padding: 3px 7px;
        background: #800000;
        color: white;
        border: none;
        cursor: pointer;
    }
</style>
</head>
<body>

<h2>Admin - Manage Students</h2>

<div id="add-student">
    <h3>Add Student</h3>
    <form id="studentForm">
        <input type="text" id="studentName" placeholder="Student Name" required>
        <input type="text" id="admissionNumber" placeholder="Admission Number" required>
        <input type="file" id="studentPhoto" accept="image/*" required>
        <button type="submit">Add Student</button>
    </form>
    <div id="formMessage"></div>
</div>

<div id="studentsList">
    <h3>Student List</h3>
    <ul id="studentListUl"></ul>
</div>

<script>
    const studentForm = document.getElementById("studentForm");
    const formMessage = document.getElementById("formMessage");
    const studentListUl = document.getElementById("studentListUl");

    // Load existing students from localStorage
    let students = JSON.parse(localStorage.getItem("students") || "[]");
    renderStudentList();

    studentForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const name = document.getElementById("studentName").value.trim();
        const admission = document.getElementById("admissionNumber").value.trim();
        const photoFile = document.getElementById("studentPhoto").files[0];

        if (!name || !admission || !photoFile) {
            formMessage.textContent = "Please fill all fields and select a photo.";
            return;
        }

        const reader = new FileReader();
        reader.onload = function() {
            const photoData = reader.result; // Base64 image string

            const newStudent = {
                name,
                admission,
                photo: photoData
            };

            students.push(newStudent);
            localStorage.setItem("students", JSON.stringify(students));
            renderStudentList();

            formMessage.textContent = "Student added successfully!";
            studentForm.reset();
        };

        reader.readAsDataURL(photoFile); // convert image to base64
    });

    function renderStudentList() {
        studentListUl.innerHTML = "";
        students.forEach((s, index) => {
            const li = document.createElement("li");
            li.innerHTML = `
                <img src="${s.photo}" alt="${s.name}" width="50" height="50">
                ${s.name} - ${s.admission}
                <button onclick="deleteStudent(${index})">Delete</button>
            `;
            studentListUl.appendChild(li);
        });
    }

    // Delete student
    window.deleteStudent = function(index) {
        students.splice(index, 1);
        localStorage.setItem("students", JSON.stringify(students));
        renderStudentList();
    };
</script>

</body>
</html>
