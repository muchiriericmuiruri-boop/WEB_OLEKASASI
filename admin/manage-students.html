<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Students - Admin</title>
<style>
body { font-family: Arial,sans-serif; margin:0; background:#f4f4f4; }
header { background:#001f3f; color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; }
button { padding:8px 12px; border:none; border-radius:4px; cursor:pointer; background:#001f3f; color:white; }
button:hover { background:#003366; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { padding:12px; border:1px solid #ccc; text-align:center; }
th { background:#001f3f; color:white; }
img { width:50px; height:50px; border-radius:50%; }
</style>
</head>
<body>

<header>
<h1>Manage Students</h1>
<button onclick="logoutUser()">Logout</button>
</header>

<main>
<button onclick="addStudent()">Add New Student</button>
<table>
<thead>
<tr>
<th>Photo</th>
<th>Name</th>
<th>Admission No.</th>
<th>UPI</th>
<th>Class</th>
<th>Parent Name</th>
<th>Parent Contact</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="studentsTable"></tbody>
</table>
</main>

<script type="module" src="../login/firebase.js"></script>
<script type="module" src="../login/main.js"></script>
<script type="module">
import { auth, db } from "../login/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { collection, getDocs, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

// Protect page
onAuthStateChanged(auth, (user) => {
    if (!user) window.location.href = "../login/";
});

// Load students
async function loadStudents() {
    const studentsCol = collection(db, "students");
    const snapshot = await getDocs(studentsCol);
    const tbody = document.getElementById("studentsTable");
    tbody.innerHTML = "";

    for (let studentDoc of snapshot.docs) {
        const student = studentDoc.data();
        const parentDoc = await getDoc(doc(db, "parents", student.parentID || student.admissionNumber));
        const parent = parentDoc.exists() ? parentDoc.data() : {};
        const tr = document.createElement("tr");
        tr.innerHTML = `
        <td><img src="${student.photoURL || ''}" alt="Student Photo"/></td>
        <td>${student.fullName}</td>
        <td>${student.admissionNumber}</td>
        <td>${student.UPI}</td>
        <td>${student.class}</td>
        <td>${parent.fullName || student.parentName || 'N/A'}</td>
        <td>${parent.phone || 'N/A'}</td>
        <td>
          <button onclick="editStudent('${studentDoc.id}')">Edit</button>
          <button onclick="deleteStudent('${studentDoc.id}')">Delete</button>
        </td>
        `;
        tbody.appendChild(tr);
    }
}

loadStudents();

// Link buttons to forms
window.addStudent = () => {
    window.location.href = "student-form.html";
}

window.editStudent = (id) => {
    window.location.href = `student-form.html?id=${id}`;
}

window.deleteStudent = async (id) => {
    if (confirm("Are you sure you want to delete this student?")) {
        await deleteDoc(doc(db, "students", id));
        loadStudents();
    }
}
</script>
</body>
</html>
