<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Teachers - Admin</title>
<style>
body { font-family: Arial,sans-serif; margin:0; background:#f4f4f4; }
header { background:#001f3f; color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; }
button { padding:8px 12px; border:none; border-radius:4px; cursor:pointer; background:#001f3f; color:white; }
button:hover { background:#003366; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { padding:12px; border:1px solid #ccc; text-align:center; }
th { background:#001f3f; color:white; }
img { width:50px; height:50px; border-radius:50%; }
</style>
</head>
<body>

<header>
<h1>Manage Teachers</h1>
<button onclick="logoutUser()">Logout</button>
</header>

<main>
<button onclick="addTeacher()">Add New Teacher</button>
<table>
<thead>
<tr>
<th>Photo</th>
<th>Name</th>
<th>Email</th>
<th>Subject</th>
<th>Assigned Classes</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="teachersTable"></tbody>
</table>
</main>

<script type="module" src="../login/firebase.js"></script>
<script type="module" src="../login/main.js"></script>
<script type="module">
import { auth, db } from "../login/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

// Protect page
onAuthStateChanged(auth, (user) => {
    if (!user) window.location.href = "../login/";
});

// Load teachers
async function loadTeachers() {
    const teachersCol = collection(db, "teachers");
    const snapshot = await getDocs(teachersCol);
    const tbody = document.getElementById("teachersTable");
    tbody.innerHTML = "";

    snapshot.docs.forEach((teacherDoc) => {
        const teacher = teacherDoc.data();
        const tr = document.createElement("tr");
        tr.innerHTML = `
        <td><img src="${teacher.photoURL || ''}" alt="Teacher Photo"/></td>
        <td>${teacher.fullName}</td>
        <td>${teacher.email}</td>
        <td>${teacher.subject}</td>
        <td>${teacher.assignedClasses.join(", ") || "N/A"}</td>
        <td>
          <button onclick="editTeacher('${teacherDoc.id}')">Edit</button>
          <button onclick="deleteTeacher('${teacherDoc.id}')">Delete</button>
        </td>
        `;
        tbody.appendChild(tr);
    });
}

loadTeachers();

// Link buttons to forms
window.addTeacher = () => {
    window.location.href = "teacher-form.html";
}

window.editTeacher = (id) => {
    window.location.href = `teacher-form.html?id=${id}`;
}

window.deleteTeacher = async (id) => {
    if (confirm("Are you sure you want to delete this teacher?")) {
        await deleteDoc(doc(db, "teachers", id));
        loadTeachers();
    }
}
</script>
</body>
</html>
